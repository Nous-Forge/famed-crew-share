ke-width="2.5" /><text x="1175" y="195" text-anchor="middle" font-size="40" font-weight="bold" fill="#1A00C2">[Sources and history]</text><text x="1175" y="231" text-anchor="middle" font-size="30" fill="#333">GDD, card records, artifact and agent logs</text><rect x="500" y="365" width="680" height="120" rx="5" fill="#FAF9F6" stroke="#007099" stroke-width="2.5" /><text x="840" y="405" text-anchor="middle" font-size="40" font-weight="bold" fill="#007099">[Studio Director]</text><text x="840" y="441" text-anchor="middle" font-size="30" fill="#333">Delegated decisions and release review</text><rect x="65" y="600" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#E08E00" stroke-width="2.5" /><text x="290" y="640" text-anchor="middle" font-size="32" font-weight="bold" fill="#E08E00">[Studio Manager]</text><text x="290" y="676" text-anchor="middle" font-size="25" fill="#333">Coordination and status</text><text x="290" y="706" text-anchor="middle" font-size="25" fill="#333">No current A4 code assignment</text><rect x="615" y="600" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#007099" stroke-width="2.5" /><text x="840" y="640" text-anchor="middle" font-size="32" font-weight="bold" fill="#007099">[Codex Runner]</text><text x="840" y="676" text-anchor="middle" font-size="25" fill="#333">Integration, document and publication</text><text x="840" y="706" text-anchor="middle" font-size="25" fill="#333">One delivery hub</text><rect x="1165" y="600" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#E08E00" stroke-width="2.5" /><text x="1390" y="640" text-anchor="middle" font-size="32" font-weight="bold" fill="#E08E00">[Lead Web Designer]</text><text x="1390" y="676" text-anchor="middle" font-size="25" fill="#333">Artifact and Home board updates</text><text x="1390" y="706" text-anchor="middle" font-size="25" fill="#333">Single artifact writer</text><rect x="65" y="850" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#0990AE" stroke-width="2.5" /><text x="290" y="890" text-anchor="middle" font-size="32" font-weight="bold" fill="#0990AE">[Art Director]</text><text x="290" y="926" text-anchor="middle" font-size="25" fill="#333">Charts and visual language</text><text x="290" y="956" text-anchor="middle" font-size="25" fill="#333">Independent visual review</text><rect x="615" y="850" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#E08E00" stroke-width="2.5" /><text x="840" y="890" text-anchor="middle" font-size="32" font-weight="bold" fill="#E08E00">[Lead Designer]</text><text x="840" y="926" text-anchor="middle" font-size="25" fill="#333">Game, source, voice and perk review</text><text x="840" y="956" text-anchor="middle" font-size="25" fill="#333">Current candidate reviewed</text><rect x="1165" y="850" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#007099" stroke-width="2.5" /><text x="1390" y="890" text-anchor="middle" font-size="32" font-weight="bold" fill="#007099">[Codex Auditor]</text><text x="1390" y="926" text-anchor="middle" font-size="25" fill="#333">Independent code and evidence review</text><text x="1390" y="956" text-anchor="middle" font-size="25" fill="#333">Current candidate reviewed</text><rect x="65" y="1100" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#E08E00" stroke-width="2.5" /><text x="290" y="1140" text-anchor="middle" font-size="32" font-weight="bold" fill="#E08E00">[Claude Studio Auditor]</text><text x="290" y="1176" text-anchor="middle" font-size="25" fill="#333">Independent return review</text><text x="290" y="1206" text-anchor="middle" font-size="25" fill="#333">Current candidate reviewed</text><rect x="615" y="1100" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#E08E00" stroke-width="2.5" /><text x="840" y="1140" text-anchor="middle" font-size="32" font-weight="bold" fill="#E08E00">[Claude Runner]</text><text x="840" y="1176" text-anchor="middle" font-size="25" fill="#333">Claude-side message bridge</text><text x="840" y="1206" text-anchor="middle" font-size="25" fill="#333">Cross-platform coordination</text><rect x="1165" y="1100" width="450" height="120" rx="5" fill="#FAF9F6" stroke="#777777" stroke-width="2.5" stroke-dasharray="9 7"/><text x="1390" y="1140" text-anchor="middle" font-size="32" font-weight="bold" fill="#777777">[Lead Engineer]</text><text x="1390" y="1176" text-anchor="middle" font-size="25" fill="#333">Standby for a scoped technical task</text><text x="1390" y="1206" text-anchor="middle" font-size="25" fill="#333">Not a current A4 code writer</text><rect x="350" y="1400" width="980" height="140" rx="5" fill="#FAF9F6" stroke="#00997A" stroke-width="2.5" /><text x="840" y="1440" text-anchor="middle" font-size="40" font-weight="bold" fill="#00997A">[Packaged content pipeline]</text><text x="840" y="1476" text-anchor="middle" font-size="30" fill="#333">Source and retrieval, generation, critics, repair or HOLD,</text><text x="840" y="1506" text-anchor="middle" font-size="30" fill="#333">final file checks, complete WIN and LOSS, retained proof</text><text x="840" y="1310" text-anchor="middle" font-size="26" fill="#555" font-style="italic">These are responsibility links, not live tool connections or automated reporting guarantees.</text><rect x="30" y="1630" width="1620" height="255" rx="5" fill="white" stroke="#888"/><text x="60" y="1676" font-size="34" font-weight="bold">Current task roles, not a process census</text><text x="60" y="1724" font-size="28">Ten Studio roles have current contribution, review, bridge, coordination or standby receipts.</text><text x="60" y="1766" font-size="28">Manager coordinates. Engineer is on standby. Completed helpers and retired roles are not active workers.</text><text x="60" y="1808" font-size="28">The separate pipeline figure shows what the repository executes. Studio oversight stays outside it.</text><text x="60" y="1852" font-size="25" fill="#666">Hook adoption and steps per agent call remain unverified. No historical control count is asserted.</text></g></svg>